site_name: pitop
site_description: Terminal-based system monitor for Raspberry Pi
site_url: https://pitop.hongjunwu.com/
repo_url: https://github.com/wu-hongjun/pitop
repo_name: wu-hongjun/pitop

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - Overview Tab: guide/overview.md
    - Processes Tab: guide/processes.md
    - Power Tab: guide/power.md
    - Network Tab: guide/network.md
    - Disk Tab: guide/disk.md
    - System Tab: guide/system.md
    - Themes: guide/themes.md
    - Stress Testing: guide/stress-testing.md
  - Supported Hardware:
    - Board Support: hardware/boards.md
    - Pi-Specific Features: hardware/pi-features.md
  - Development:
    - Architecture: development/architecture.md
    - Building: development/building.md
    - Testing: development/testing.md
    - Contributing: development/contributing.md
  - Reference:
    - CLI Options: reference/cli.md
    - Keyboard Shortcuts: reference/keybindings.md
    - Config File: reference/config-file.md
    - Changelog: changelog.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - tables
