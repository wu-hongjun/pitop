[package]
name = "pitop"
version = "0.1.0"
edition = "2021"
authors = ["pitop contributors"]
description = "Terminal-based system monitor for Raspberry Pi"
license = "MIT"
readme = "README.md"
homepage = "https://pitop.hongjunwu.com"
documentation = "https://pitop.hongjunwu.com"
repository = "https://github.com/wu-hongjun/pitop"
keywords = ["raspberry-pi", "tui", "monitoring", "system"]
categories = ["command-line-utilities"]
exclude = [
  "bmad-artifacts/",
  "_bmad/",
  "_bmad-output/",
  ".cursor/",
  ".agents/",
  "tests/fixtures/",
  "docs/",
  "scripts/",
  ".github/",
]

[dependencies]
# TUI
ratatui = { version = "0.29", features = ["serde"] }
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "time", "process", "fs", "macros", "io-util"] }

# Error handling
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# System calls
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"     # Optimize for size (important for Zero 2W)
lto = true          # Link-time optimization
strip = true        # Strip debug symbols
codegen-units = 1   # Better optimization at cost of compile time
panic = "abort"     # Smaller binary
