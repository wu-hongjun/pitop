[package]
name = "pitop"
version = "0.1.0"
edition = "2021"
authors = ["pitop contributors"]
description = "Terminal-based system monitor for Raspberry Pi"
license = "MIT"
repository = "https://github.com/OWNER/pitop"
keywords = ["raspberry-pi", "tui", "monitoring", "system"]
categories = ["command-line-utilities"]

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["rt", "time", "process", "fs", "macros", "io-util"] }

# Error handling
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization (for config)
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = "z"     # Optimize for size (important for Zero 2W)
lto = true          # Link-time optimization
strip = true        # Strip debug symbols
codegen-units = 1   # Better optimization at cost of compile time
panic = "abort"     # Smaller binary
